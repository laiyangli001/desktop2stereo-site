name: Desktop2Stereo licensing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d2s-licensing.yml'
      - 'scripts/d2s-sensitive-scan.ps1'
      - 'scripts/d2s-go-deps.ps1'
      - 'scripts/d2s-production-readiness.ps1'
      - 'scripts/d2s-reconciliation.ps1'
      - 'controller/d2s_*.go'
      - 'controller/payment_webhook_availability*.go'
      - 'controller/topup*.go'
      - 'middleware/audit.go'
      - 'model/d2s_*.go'
      - 'router/d2s-*.go'
      - 'router/api-router.go'
      - 'service/waffo_pancake.go'
      - 'service/d2s_*.go'
      - 'web/src/features/d2s/**'
      - 'web/src/routes/_authenticated/d2s/**'
      - 'web/src/routes/_authenticated/d2s-admin/**'
      - 'web/src/routes/device.tsx'
      - 'web/src/routes/__tests__/device.test.tsx'
      - 'web/src/hooks/use-sidebar-data.ts'
      - 'web/src/routeTree.gen.ts'
      - 'web/package.json'
      - 'web/bun.lock'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/d2s-licensing.yml'
      - 'scripts/d2s-sensitive-scan.ps1'
      - 'scripts/d2s-go-deps.ps1'
      - 'scripts/d2s-production-readiness.ps1'
      - 'scripts/d2s-reconciliation.ps1'
      - 'controller/d2s_*.go'
      - 'controller/payment_webhook_availability*.go'
      - 'controller/topup*.go'
      - 'middleware/audit.go'
      - 'model/d2s_*.go'
      - 'router/d2s-*.go'
      - 'router/api-router.go'
      - 'service/waffo_pancake.go'
      - 'service/d2s_*.go'
      - 'web/src/features/d2s/**'
      - 'web/src/routes/_authenticated/d2s/**'
      - 'web/src/routes/_authenticated/d2s-admin/**'
      - 'web/src/routes/device.tsx'
      - 'web/src/routes/__tests__/device.test.tsx'
      - 'web/src/hooks/use-sidebar-data.ts'
      - 'web/src/routeTree.gen.ts'
      - 'web/package.json'
      - 'web/bun.lock'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  unit:
    name: D2S unit and adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: 'off'
      GOPROXY: 'https://proxy.golang.org,direct'
      GOSUMDB: 'sum.golang.org'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build embedded frontend for root Go package
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Run D2S unit tests
        run: go test ./controller ./model ./service -run 'D2S' -count=1
      - name: Run complete Go test suite
        run: go test ./... -count=1
      - name: Run Go static checks and root build
        run: |
          go vet ./controller ./model ./service ./router
          go build ./...
      - name: Scan tracked files for sensitive material
        shell: pwsh
        run: ./scripts/d2s-sensitive-scan.ps1
      - name: Validate deployment PowerShell scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            './scripts/d2s-go-deps.ps1',
            './scripts/d2s-production-readiness.ps1',
            './scripts/d2s-reconciliation.ps1'
          )) {
            $script = Get-Content -Raw -Encoding UTF8 $path
            [void][scriptblock]::Create($script)
          }
      - name: Run production readiness secret smoke test
        shell: pwsh
        run: |
          $env:SQL_DSN = 'ci-placeholder'
          $env:REDIS_CONN_STRING = 'ci-placeholder'
          $env:SESSION_SECRET = 's' * 32
          $env:D2S_LICENSE_KEY_ID = 'ci-key'
          $bridgeSecretName = 'D2S_' + 'PAYMENT_BRIDGE_SECRET'
          Set-Item "Env:$bridgeSecretName" ('p' * 32)
          $privateKeyName = 'D2S_' + 'LICENSE_PRIVATE_KEY_B64'
          Set-Item "Env:$privateKeyName" ([Convert]::ToBase64String([byte[]]@(0x30) + [byte[]]@(1..32)))
          $env:D2S_OFFLINE_EXTENSION_CNY_MINOR = '3000'
          $env:D2S_OFFLINE_EXTENSION_USD_MINOR = '500'
          $env:D2S_DEVICE_VERIFICATION_URI = 'https://d2s.site/device'
          $env:SESSION_COOKIE_TRUSTED_URL = 'https://d2s.site'
          $env:TRUSTED_PROXIES = 'none'
          $env:SESSION_COOKIE_SECURE = 'true'
          ./scripts/d2s-production-readiness.ps1 -RequireSecrets -SkipHttp

  frontend:
    name: D2S frontend typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, build, and run D2S frontend tests
        run: |
          bunx oxlint -c .oxlintrc.json src/features/d2s src/routes/_authenticated/d2s src/routes/_authenticated/d2s-admin src/routes/device.tsx src/routes/__tests__/device.test.tsx
          bun run build:check
          bun run test -- src/features/d2s/__tests__ src/routes/__tests__/device.test.tsx

  databases:
    name: MySQL and PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GOWORK: 'off'
      GOPROXY: 'https://proxy.golang.org,direct'
      GOSUMDB: 'sum.golang.org'
      D2S_TEST_MYSQL_DSN: root:d2s_test@tcp(127.0.0.1:3306)/d2s_test?charset=utf8mb4&parseTime=True&loc=Local
      D2S_TEST_POSTGRES_DSN: host=127.0.0.1 user=d2s password=d2s_test dbname=d2s_test port=5432 sslmode=disable TimeZone=UTC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pull and start database containers with retry
        shell: bash
        run: |
          set -euo pipefail

          retry_pull() {
            local image="$1"
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                return 0
              fi
              echo "docker pull failed for $image (attempt $attempt/5)" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          retry_pull mysql:8.4
          retry_pull postgres:16
          docker run --detach --name d2s-ci-mysql \
            --env MYSQL_ROOT_PASSWORD=d2s_test \
            --env MYSQL_DATABASE=d2s_test \
            --publish 3306:3306 mysql:8.4
          docker run --detach --name d2s-ci-postgres \
            --env POSTGRES_USER=d2s \
            --env POSTGRES_PASSWORD=d2s_test \
            --env POSTGRES_DB=d2s_test \
            --publish 5432:5432 postgres:16

          for attempt in {1..30}; do
            mysql_ready=false
            postgres_ready=false
            docker exec d2s-ci-mysql mysqladmin ping -h 127.0.0.1 -pd2s_test >/dev/null 2>&1 && mysql_ready=true
            docker exec d2s-ci-postgres pg_isready -U d2s -d d2s_test >/dev/null 2>&1 && postgres_ready=true
            if [[ "$mysql_ready" == true && "$postgres_ready" == true ]]; then
              exit 0
            fi
            sleep 2
          done
          docker logs d2s-ci-mysql || true
          docker logs d2s-ci-postgres || true
          exit 1
      - name: Run real database migration and concurrency matrix
        run: go test ./model -run '^TestD2S(SchemaConfiguredDatabases|ConcurrentCriticalPaths)$' -count=1 -v
      - name: Remove database containers
        if: always()
        shell: bash
        run: docker rm --force d2s-ci-mysql d2s-ci-postgres 2>/dev/null || true
